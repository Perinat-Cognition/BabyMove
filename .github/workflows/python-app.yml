name: BabyMove Release

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BabyMove
    runs-on: windows-latest

    steps:
      # Récupérer le code correspondant à la Release
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # Installer Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

          pip install pyinstaller flake8 pytest

      # Lancer pytest uniquement si des tests existent dans le dépôt
      - name: Run pytest
        run: |
          $testFiles = Get-ChildItem -Path . -Recurse -File | Where-Object {
            $_.Name -like "test_*.py" -or
            $_.Name -like "*_test.py" -or
            $_.FullName -match "\\tests\\"
          }

          if ($testFiles.Count -eq 0) {
            Write-Host "Aucun test détecté; pytest est ignoré."
            exit 0
          }

          pytest

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Vérifier le code avec Flake8
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Compiler BabyMove
      - name: Build BabyMove
        run: |
          pyinstaller --onefile --name BabyMove app.py

      # Vérifier que l'exécutable existe
      - name: Verify executable
        run: |
          if (!(Test-Path "dist/BabyMove.exe")) {
            Write-Error "BabyMove.exe n'a pas été généré."
            exit 1
          }

      # Ajouter l'exécutable à la Release GitHub
      - name: Upload BabyMove.exe to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/BabyMove.exe
